<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Заголовок страницы</title>
    <style>
        /* Сброс стилей */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Основные стили для тела страницы */
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            background-color: #f4f4f4;
            color: #333;
        }

        /* Стиль для шапки */
        header {
            background-color: #333;
            color: #fff;
            padding: 10px 0;
        }

        header nav ul {
            list-style: none;
            text-align: center;
        }

        header nav ul li {
            display: inline;
            margin-right: 20px;
        }

        header nav ul li a {
            color: #fff;
            text-decoration: none;
            font-weight: bold;
        }

        header nav ul li a:hover {
            text-decoration: underline;
        }

        /* Основной контент */
        main {
            padding: 20px;
            background-color: #fff;
        }

        section {
            margin-bottom: 20px;
        }

        h1, h2 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
        }

        /* Стиль для футера */
        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px 0;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <ul>
                <li><a href="#home">Главная</a></li>
                <li><a href="#about">О нас</a></li>
                <li><a href="#services">Услуги</a></li>
                <li><a href="#contact">Контакты</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="home">
            <h1>Добро пожаловать на нашу страницу</h1>
            <p>Информация о компании...</p>
        </section>

        <section id="about">
            <h2>О нас</h2>
            <p>Описание компании...</p>
        </section>

        <section id="services">
            <h2>Услуги</h2>
            <p>Перечень услуг...</p>
        </section>

        <section id="contact">
            <h2>Контакты</h2>
            <p>Адрес, телефон, email...</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Ваша компания</p>
    </footer>

</body>
</html>
