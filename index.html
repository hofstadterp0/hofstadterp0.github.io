<!-- Рекомендуемо для iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<script src="https://pxl-pz69gr78pumdh8my.dev.altcraft.com/ak_container.js?id=MXw2"></script>

<style>
  #pwa-install[disabled] { opacity:.5; cursor:not-allowed; }
</style>

<title>PWA</title>
</head>
<body>

<!-- Кнопка подписки -->
<button id="init_sub">Подписаться на пуши</button> <!-- Кнопка подписки -->

<!-- Кнопка установки -->
<button id="pwa-install" hidden>Установить приложение</button>

<!-- Модалка-подсказка для iOS -->
<dialog id="ios-help">
  <h3>Добавить на экран «Домой»</h3>
  <ol>
    <li>Нажмите кнопку «Поделиться» в Safari.</li>
    <li>Выберите «На экран “Домой”».</li>
    <li>Подтвердите установку.</li>
  </ol>
  <form method="dialog"><button>Понятно</button></form>
</dialog>

<script>
// 1) Регистрация Service Worker (поставьте корректный путь!)
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker
      .register('/service-worker.js') 
      .then(reg => console.log('✅ SW зарегистрирован:', reg.scope))
      .catch(err => console.warn('❌ SW ошибка:', err));
  });
}

// 2) Подписка на пуши (ваш код)
document.getElementById('init_sub').addEventListener('click', () => {
  try {
    const akPush = new AKPush();
    akPush.initSubscription();
  } catch (e) {
    console.log(e);
  }
});

// 3) Логика install-кнопки
(() => {
  const btn = document.getElementById('pwa-install');
  const iosHelp = document.getElementById('ios-help');

  const isIOS = () => {
    const ua = navigator.userAgent || '';
    const platform = navigator.platform || '';
    return /iPad|iPhone|iPod/.test(platform) || (ua.includes('Mac') && 'ontouchend' in document);
  };
  const isStandalone = () =>
    matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;

  let deferred; // beforeinstallprompt event

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferred = e;
    if (!isStandalone()) {
      btn.hidden = false;
      btn.disabled = false;
      btn.textContent = 'Установить приложение';
    }
  });

  window.addEventListener('appinstalled', () => {
    btn.disabled = true;
    btn.textContent = 'Установлено';
  });

  btn.addEventListener('click', async () => {
    if (isIOS()) {
      if (iosHelp?.showModal) iosHelp.showModal();
      else alert('В Safari: Поделиться → На экран «Домой».');
      return;
    }
    if (deferred) {
      try {
        await deferred.prompt();
        const { outcome } = await deferred.userChoice;
        if (outcome === 'accepted') {
          btn.disabled = true;
          btn.textContent = 'Установлено';
        }
      } finally {
        deferred = null; // одноразовое
      }
    } else {
      // Нет поддержки установки — спрячем
      btn.hidden = true;
    }
  });

  // Инициализация на загрузке
  (function init() {
    if (isStandalone()) {
      btn.disabled = true;
      btn.textContent = 'Установлено';
      btn.hidden = false;
      return;
    }
    if (isIOS()) {
      // На iOS нет prompt — показываем кнопку-подсказку
      btn.hidden = false;
      btn.disabled = false;
      btn.textContent = 'Добавить на экран «Домой»';
      return;
    }
    // В остальных браузерах кнопку покажет beforeinstallprompt, здесь не делаем ничего
  })();

  // Если режим окна поменялся на standalone
  matchMedia('(display-mode: standalone)').addEventListener?.('change', (e) => {
    if (e.matches) {
      btn.disabled = true;
      btn.textContent = 'Установлено';
      btn.hidden = false;
    }
  });
})();
</script>

</body>
</html>
